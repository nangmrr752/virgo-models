# Virgo on your own GPU server, at your own address (Cloudflare Tunnel). See DOCKER.md.
#   cp .env.example .env   # fill in the three values
#   docker compose up -d --build
#   docker compose logs -f virgo
services:
  virgo:
    build: { context: ., dockerfile: docker/Dockerfile.gpu }
    restart: unless-stopped
    env_file: .env
    environment:
      VIRGO_TUNNEL: external        # the tunnel is the "tunnel" service below
    volumes:
      - ${VIRGO_DATA:-/opt/virgo/docker}:/workspace   # models, voice, caches: kept across restarts
      # The Hugging Face downloads already on this machine (training uses the same folder), so Gemma
      # 3 27B (~55 GB) and the others aren't downloaded a second time.
      - ${HF_CACHE:-/opt/virgo/hf-cache}:/workspace/hf-cache
    deploy:
      resources:
        reservations:
          devices:
            - { driver: nvidia, count: all, capabilities: [gpu] }
    shm_size: "8gb"
    ports:
      - "127.0.0.1:${VIRGO_PORT:-8088}:8000"   # only this machine; the tunnel reaches it at http://127.0.0.1:8088
    healthcheck:   # up once the voice and ears are loaded (the llama service waits for this)
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8000/v1/models"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 1800s

  # Angkor-2.0 (Gemma 4 26B A4B, 4-bit GGUF, ~16 GB; what doesn't fit on the GPU stays in RAM) through llama.cpp. Off unless .env has
  #   COMPOSE_PROFILES=llama
  #   VIRGO_LLAMA_URL=http://llama:8080
  # The first start downloads the model (~15 GB) into ${VIRGO_LLAMA_CACHE:-/opt/virgo/llama-cache}.
  llama:
    profiles: ["llama"]
    build:
      context: docker
      dockerfile: llama-cuda.Dockerfile
      args: { CUDA: "${VIRGO_LLAMA_CUDA:-12.2.2}" }   # driver 535 → 12.2.2; driver 550+ → 12.4.1
    image: virgo-llama:cuda12
    restart: unless-stopped
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
    # No -ngl: llama.cpp fits the model into the GPU memory left after Virgo's voice and ears, keeping the
    # rest (some MoE experts) in RAM. More flags with VIRGO_LLAMA_ARGS (e.g. "-ngl 999" when the GPU is free).
    command: >-
      -hf ${VIRGO_LLAMA_MODEL:-unsloth/gemma-4-26B-A4B-it-GGUF:UD-Q4_K_XL}
      -c ${VIRGO_LLAMA_CTX:-8192} --jinja --host 0.0.0.0 --port 8080 ${VIRGO_LLAMA_ARGS:-}
    # Start after Virgo has loaded its voice and ears, so they always get their GPU memory first.
    depends_on:
      virgo: { condition: service_healthy }
    volumes:
      - ${VIRGO_LLAMA_CACHE:-/opt/virgo/llama-cache}:/root/.cache/llama.cpp
    deploy:
      resources:
        reservations:
          devices:
            - { driver: nvidia, count: all, capabilities: [gpu] }
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 3600s   # the first download takes a while

  tunnel:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CF_TUNNEL_TOKEN}
    # The host's network, so the tunnel's "http://127.0.0.1:8088" reaches the virgo container's port.
    # (Not virgo's own network: that breaks every time the virgo container restarts.)
    network_mode: host
