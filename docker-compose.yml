# Virgo on your own GPU server, at your own address (Cloudflare Tunnel). See DOCKER.md.
#   cp .env.example .env   # fill in the three values
#   docker compose up -d --build
#   docker compose logs -f virgo
services:
  virgo:
    build: { context: ., dockerfile: docker/Dockerfile.gpu }
    restart: unless-stopped
    env_file: .env
    environment:
      VIRGO_TUNNEL: external        # the tunnel is the "tunnel" service below
    volumes:
      - ${VIRGO_DATA:-/opt/virgo/docker}:/workspace   # models, voice, caches: kept across restarts
      # The Hugging Face downloads already on this machine (training uses the same folder), so Gemma
      # 3 27B (~55 GB) and the others aren't downloaded a second time.
      - ${HF_CACHE:-/opt/virgo/hf-cache}:/workspace/hf-cache
    deploy:
      resources:
        reservations:
          devices:
            - { driver: nvidia, count: all, capabilities: [gpu] }
    shm_size: "8gb"
    ports:
      - "127.0.0.1:${VIRGO_PORT:-8088}:8000"   # only this machine; the tunnel reaches it at http://127.0.0.1:8088
    healthcheck:   # up once the voice and ears are loaded (the llama service waits for this)
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8000/v1/models"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 1800s

  # Angkor-2.0 (Gemma 4 26B A4B, 4-bit GGUF, ~16 GB; what doesn't fit on the GPU stays in RAM) through llama.cpp. Off unless .env has
  #   COMPOSE_PROFILES=llama
  #   VIRGO_LLAMA_URL=http://llama:8080
  # The first start downloads the model (~16 GB) into the Hugging Face cache (${HF_CACHE:-/opt/virgo/hf-cache}).
  llama:
    profiles: ["llama"]
    build:
      context: docker
      dockerfile: llama-cuda.Dockerfile
      args: { CUDA: "${VIRGO_LLAMA_CUDA:-12.2.2}" }   # driver 535 → 12.2.2; driver 550+ → 12.4.1
    image: virgo-llama:cuda12
    restart: unless-stopped
    # Virgo's switcher (docker/llama_router.py): Angkor-2.0 normally; Bayon-2.0 (VIRGO_BAYON_MODEL, e.g. Gemma 4
    # 31B) loads when someone picks Bayon and Angkor comes back after VIRGO_BAYON_IDLE seconds without Bayon.
    # --reasoning-budget 0: answers without thinking first (fast, and Khmer answers aren't used up by thinking).
    # --no-mmproj: text only (Gemma 4's image part would take ~1 GB more; images go elsewhere).
    # No -ngl: llama.cpp fits each model into the GPU memory left after Virgo's voice and ears (the rest in RAM).
    entrypoint: ["python3", "/app/llama_router.py"]
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
      ANGKOR_MODEL: ${VIRGO_LLAMA_MODEL:-unsloth/gemma-4-26B-A4B-it-GGUF:UD-Q4_K_XL}
      ANGKOR_ARGS: -c ${VIRGO_LLAMA_CTX:-8192} --jinja --no-mmproj --reasoning-budget ${VIRGO_LLAMA_REASONING_BUDGET:-0} ${VIRGO_LLAMA_ARGS:-}
      BAYON_MODEL: ${VIRGO_BAYON_MODEL:-}
      BAYON_ARGS: -c ${VIRGO_BAYON_CTX:-8192} --jinja --no-mmproj --reasoning-budget ${VIRGO_BAYON_REASONING_BUDGET:-0} ${VIRGO_BAYON_ARGS:-}
      BAYON_IDLE: ${VIRGO_BAYON_IDLE:-600}
    # Start after Virgo has loaded its voice and ears, so they always get their GPU memory first.
    depends_on:
      virgo: { condition: service_healthy }
    # Newer llama.cpp keeps -hf downloads in the Hugging Face cache: the machine's own (the same as training's),
    # so the ~16 GB model survives a rebuild instead of downloading again.
    volumes:
      - ${HF_CACHE:-/opt/virgo/hf-cache}:/root/.cache/huggingface
      - ${VIRGO_LLAMA_CACHE:-/opt/virgo/llama-cache}:/root/.cache/llama.cpp
    deploy:
      resources:
        reservations:
          devices:
            - { driver: nvidia, count: all, capabilities: [gpu] }
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 3600s   # the first download takes a while

  tunnel:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CF_TUNNEL_TOKEN}
    # The host's network, so the tunnel's "http://127.0.0.1:8088" reaches the virgo container's port.
    # (Not virgo's own network: that breaks every time the virgo container restarts.)
    network_mode: host
